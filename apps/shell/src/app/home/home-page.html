<section class="space-y-8">
  <div class="space-y-2">
    <h1 class="text-3xl font-semibold tracking-tight">Realtime Chat</h1>
    <p class="text-muted-foreground">
      Phase 0 smoke test: Angular shell, Native Federation, Tailwind CSS v4 and
      zard/ui.
    </p>
  </div>

  <div class="flex flex-wrap gap-3">
    <a z-button routerLink="/chat">Mở Chat MFE</a>
    <button z-button zType="outline" type="button" (click)="health.reload()">
      Kiểm tra lại API
    </button>
  </div>

  <z-card class="max-w-md" data-testid="api-health">
    <z-card-header>
      <z-card-title zTitle="API gateway" />
      <z-card-description zDescription="GET /api/health" />
    </z-card-header>
    <z-card-content class="flex items-center gap-3">
      <z-badge [zType]="apiStatus().type">{{ apiStatus().label }}</z-badge>
      @if (apiResponse(); as body) {
      <code class="rounded bg-muted px-2 py-1 font-mono text-sm"
        >{{ body }}</code
      >
      }
    </z-card-content>
  </z-card>
</section>
